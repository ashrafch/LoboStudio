map $host $client_preview_origin {
    default http://127.0.0.1:3082;
    ~^[a-z0-9-]+\.trycloudflare\.com$ https://$host;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Robots-Tag;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    sub_filter 'http://localhost:3000/opengraph-image' '$client_preview_origin/opengraph-image';
    sub_filter_once off;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ~ ^/(?:|studio|servizi|contatti|clienti|rassegna-stampa|privacy|note-legali|competenze/sisma-emilia-2012|progetti(?:/(?:categoria/)?[a-z0-9-]+)?|robots\.txt|sitemap\.xml|icon|favicon\.ico|opengraph-image)$ {
        proxy_pass http://studio:3000;
    }

    location ~ ^/(?:anteprima-media/[a-z0-9-]+|media/attivita/[a-z0-9-]+\.webp|_next/static/[a-zA-Z0-9_./-]+|_next/image)$ {
        proxy_pass http://studio:3000;
    }

    location / {
        return 404;
    }
}
